services:
  web:
    environment:
      RUN_MIGRATIONS: "1"
      ALLOW_PUBLIC_REGISTRATION: "0"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,.ngrok-free.app,.ngrok.app"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost:8000,https://*.ngrok-free.app,https://*.ngrok.app"
      DJANGO_USE_X_FORWARDED_HOST: "1"
      DJANGO_SECURE_PROXY_SSL_HEADER: "1"

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - http
      - http://web:8000
      - --log
      - stdout
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Defina NGROK_AUTHTOKEN no arquivo .env}
    ports:
      - "127.0.0.1:4040:4040"
    depends_on:
      web:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
