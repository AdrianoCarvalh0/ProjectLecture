services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-projectlecture}
      MYSQL_USER: ${MYSQL_USER:-projectlecture}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-projectlecture}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_projectlecture}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_projectlecture}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  neural-tts:
    build:
      context: .
      dockerfile: Dockerfile.neural
      args:
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        TORCH_VERSION: ${TORCH_VERSION:-2.13.0}
    restart: unless-stopped
    environment:
      KOKORO_MODEL_ID: ${KOKORO_MODEL_ID:-hexgrad/Kokoro-82M}
      HF_TOKEN: ${HF_TOKEN:-}
      TTS_PRELOAD_MODEL: ${TTS_PRELOAD_MODEL:-0}
      TTS_DEVICE: ${TTS_DEVICE:-cpu}
    volumes:
      - model_cache:/models/huggingface
    ports:
      - "${NEURAL_TTS_PORT:-8100}:8100"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "1"
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      neural-tts:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build: .
    restart: unless-stopped
    command: celery -A config worker -l INFO --concurrency=2
    env_file:
      - .env
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
      neural-tts:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  media_data:
  static_data:
  model_cache:
